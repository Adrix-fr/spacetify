name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The desktop app (Tauri) needs WebKitGTK and a tray library on Linux.
      - name: Linux libraries for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # The app's Rust code embeds the built web files, so they come first.
      - name: Desktop app web files
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm run build

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --release --locked

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: check
    env:
      # Set these repository secrets once the SignPath Foundation has accepted
      # the project; until then the installer is built unsigned.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build the installer
        working-directory: apps/desktop
        run: |
          npm ci
          npm run bundle

      - name: Collect the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Copy-Item target/release/spacetify.exe out/
          Copy-Item target/release/spacetify-service.exe out/
          Copy-Item target/release/spacetify-app.exe out/

      - name: Upload the unsigned files
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: spacetify-windows-unsigned
          path: out/

      # Signing through the SignPath Foundation (free for open-source
      # projects). Only for tagged releases or a manual run, and only once the
      # secrets above exist.
      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: spacetify
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out

      - name: SHA-256 of every file
        shell: pwsh
        run: |
          Get-ChildItem out -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: spacetify-windows
          path: out/
