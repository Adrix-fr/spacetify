      <g transform="rotate(-15 32 33)"><ellipse cx="32" cy="33" rx="30" ry="9" stroke="url(#g)" stroke-width="5.5"/></g>
      <circle cx="32" cy="33" r="20" fill="url(#g)"/>
    </g>
    <g transform="rotate(-15 32 33)"><path d="M2 33A30 9 0 0 0 62 33" stroke="url(#g)" stroke-width="5.5"/></g>
  </g>
